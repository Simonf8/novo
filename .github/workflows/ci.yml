name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
      - if: runner.os == 'macOS'
        run: cargo build --locked --features metal,accelerate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --features python

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: python3 tools/fuzz.py diff --count 300 --seed ${{ github.run_number }}
      - run: python3 tools/fuzz.py mutate --count 300 --seed ${{ github.run_number }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: target/fuzz/

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Run the benchmarks
        run: |
          {
            echo "| Benchmark | Native | Interpreter |"
            echo "|---|---|---|"
            for f in benches/*.nv; do
              native=$(target/release/novo bench "$f" -n 5 | sed -n 's/.*mean \([0-9.]* ms\).*/\1/p')
              interp=$(target/release/novo bench "$f" -n 3 --interp | sed -n 's/.*mean \([0-9.]* ms\).*/\1/p')
              echo "| $(basename "$f" .nv) | $native | $interp |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
