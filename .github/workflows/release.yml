name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            features: metal,accelerate
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --profile dist --features "${{ matrix.features }}"
        shell: bash
      - name: Package
        shell: bash
        run: |
          name=novo-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp README.md CHANGELOG.md "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/dist/novo.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/dist/novo "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: novo-*.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum novo-* > SHA256SUMS
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {on=1; next} /^## /{on=0} on' ../CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "Novo $GITHUB_REF_NAME" --notes "$notes" novo-* SHA256SUMS
